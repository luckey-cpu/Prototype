# TxSentinel - Netlify Configuration
[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# Single Page Application (SPA) routing fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
